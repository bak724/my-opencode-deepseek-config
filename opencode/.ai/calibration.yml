# Code-review severity calibration.
# When a review agent finds a pattern listed here, it MUST downgrade the
# severity as specified and cite the calibration entry.
#
# This file is tracked in git and shared by the team; the code-review skill
# reads it (reviewer loads that skill). For machine-local overrides you
# don't want to commit, keep a gitignored `.ai/calibration.local.yml` instead.

calibrations:
  - pattern: "missing authentication on localhost-only internal tool"
    downgrade: "high -> low"
    reason: "internal use only, no external exposure"
  - pattern: "console.log in CLI tool"
    downgrade: "minor -> nit"
    reason: "CLI output is intentional user-facing logging"
  - pattern: "hardcoded API key in dev/test config"
    downgrade: "critical -> minor"
    reason: "dev-only config, not deployed; documented convention"
